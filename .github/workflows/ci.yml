name: CI / Security and Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Forks and untrusted pull requests: no deployments or write token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets / Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      # The upstream action scans only the event's commit range by default.
      # This independent check covers all reachable refs/commits.
      - name: Scan full Git history (verified Gitleaks CLI)
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 15 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/gitleaks-cli"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-cli" gitleaks
          "$RUNNER_TEMP/gitleaks-cli/gitleaks" version
          "$RUNNER_TEMP/gitleaks-cli/gitleaks" git \
            --log-opts="--all" --redact --no-banner .

  python:
    name: Python / Tools and Setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check Python
        run: python3 --version

      - name: Verify vendored Termux files and patches
        run: python3 android/terminal/upstream/verify.py

      - name: Check syntax without touching services
        run: python3 -m compileall -q ops server/tests

      - name: Run Python operations unit tests
        env:
          PYTHONPATH: ops
        run: python3 -m unittest discover -s ops/tests -p 'test_*.py' -v

      - name: Run setup unit tests (fixtures only)
        env:
          PYTHONPATH: ops/setup:ops
        run: python3 -m unittest discover -s ops/setup/tests -p 'test_*.py' -v

  server:
    name: C++ / Core and Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install build headers on disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ make libpq-dev libssl-dev

      - name: Build and test Core
        run: make -C server -j1 test

  android:
    name: Android / JVM and Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'

      - name: JVM tests and debug APK (not published)
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug
